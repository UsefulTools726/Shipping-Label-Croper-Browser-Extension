<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Correct Label Crop</title>
  <style>
    :root {
      --bg: #f0f3f6;
      --panel: #ffffff;
      --ink: #1c2430;
      --muted: #5a6675;
      --accent: #3d6f99;
      --accent-hover: #325c80;
      --border: #d5dde6;
      --sel: #e07a2f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      flex: 1;
      min-width: 160px;
    }
    #meta {
      font-size: 12px;
      color: var(--muted);
      width: 100%;
    }
    .margins {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      width: 100%;
      font-size: 12px;
      color: var(--muted);
    }
    .margin-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .margin-group label {
      color: var(--ink);
      font-weight: 500;
      white-space: nowrap;
    }
    .stepper {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }
    .stepper button {
      margin: 0;
      padding: 4px 10px;
      border: none;
      border-radius: 0;
      background: #fff;
      font-size: 14px;
      line-height: 1;
    }
    .stepper button:hover { background: #eef2f6; }
    .stepper input {
      width: 52px;
      border: none;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      padding: 4px 6px;
      text-align: center;
      font-size: 13px;
      color: var(--ink);
    }
    .stepper input:focus { outline: none; background: #f7fafc; }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #eef2f6; }
    button:disabled { opacity: 0.5; cursor: default; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover { background: var(--accent-hover); }
    button.secondary {
      background: #fff;
      border-color: var(--sel);
      color: var(--sel);
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: auto;
    }
    #stage {
      position: relative;
      box-shadow: 0 8px 28px rgba(28, 36, 48, 0.12);
      background: #fff;
      line-height: 0;
      user-select: none;
    }
    #pdfCanvas {
      display: block;
      max-width: calc(100vw - 40px);
      height: auto;
    }
    #overlay {
      position: absolute;
      inset: 0;
      cursor: crosshair;
    }
    #selection {
      position: absolute;
      border: 2px solid var(--sel);
      background: rgba(224, 122, 47, 0.12);
      box-shadow: 0 0 0 9999px rgba(28, 36, 48, 0.35);
      cursor: move;
      display: none;
    }
    .handle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #fff;
      border: 2px solid var(--sel);
      border-radius: 2px;
    }
    .handle.nw { left: -6px; top: -6px; cursor: nwse-resize; }
    .handle.ne { right: -6px; top: -6px; cursor: nesw-resize; }
    .handle.sw { left: -6px; bottom: -6px; cursor: nesw-resize; }
    .handle.se { right: -6px; bottom: -6px; cursor: nwse-resize; }
    .handle.n { left: 50%; top: -6px; margin-left: -5px; cursor: ns-resize; }
    .handle.s { left: 50%; bottom: -6px; margin-left: -5px; cursor: ns-resize; }
    .handle.w { left: -6px; top: 50%; margin-top: -5px; cursor: ew-resize; }
    .handle.e { right: -6px; top: 50%; margin-top: -5px; cursor: ew-resize; }
    #status {
      padding: 10px 20px;
      font-size: 13px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    #status.error { color: #b42318; }
  </style>
</head>
<body>
  <header>
    <h1>Correct label crop</h1>
    <div class="actions">
      <button type="button" id="redetectBtn">Re-detect</button>
      <button type="button" id="cropOnlyBtn">Crop only</button>
      <button type="button" id="saveBtn" class="primary">Save template &amp; crop</button>
    </div>
    <div id="meta">Loading…</div>
    <div class="margins">
      <span>Margins (pt)</span>
      <div class="margin-group">
        <label for="marginLR">Left / Right</label>
        <div class="stepper">
          <button type="button" id="marginLRDec" aria-label="Decrease left/right margin">−</button>
          <input type="number" id="marginLR" value="0" step="1">
          <button type="button" id="marginLRInc" aria-label="Increase left/right margin">+</button>
        </div>
      </div>
      <div class="margin-group">
        <label for="marginTB">Top / Bottom</label>
        <div class="stepper">
          <button type="button" id="marginTBDec" aria-label="Decrease top/bottom margin">−</button>
          <input type="number" id="marginTB" value="0" step="1">
          <button type="button" id="marginTBInc" aria-label="Increase top/bottom margin">+</button>
        </div>
      </div>
    </div>
  </header>
  <main>
    <div id="stage">
      <canvas id="pdfCanvas"></canvas>
      <div id="overlay">
        <div id="selection">
          <div class="handle nw" data-handle="nw"></div>
          <div class="handle n" data-handle="n"></div>
          <div class="handle ne" data-handle="ne"></div>
          <div class="handle e" data-handle="e"></div>
          <div class="handle se" data-handle="se"></div>
          <div class="handle s" data-handle="s"></div>
          <div class="handle sw" data-handle="sw"></div>
          <div class="handle w" data-handle="w"></div>
        </div>
      </div>
    </div>
  </main>
  <div id="status">Drag the orange box to adjust. Drag outside it to draw a new crop.</div>

  <script src="libs/pdf-lib.min.js"></script>
  <script src="libs/pdf.min.js"></script>
  <script src="label-core.js"></script>
  <script src="editor.js"></script>
</body>
</html>
